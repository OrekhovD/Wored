<!DOCTYPE html>
<html lang="ru">
<head>
  {% block head_extra %}{% endblock %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{{ page_title or "WORED Web UI" }}</title>
  <link rel="stylesheet" href="/static/ui/tokens.css">
  <link rel="stylesheet" href="/static/styles.css?v=5">
  <script src="https://unpkg.com/lightweight-charts@5.2.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <div class="shell">
    {% include "partials/navigation.html" %}

    {% if flash %}
      <div class="flash flash-{{ flash.level }}">{{ flash.message }}</div>
    {% endif %}

    {% block content %}{% endblock %}

    <footer class="footer">
      <div>WORED — интерфейс управления</div>
      <div class="attribution">
        {{ chart_notice }}
        <a href="https://www.tradingview.com/" target="_blank" rel="noreferrer">TradingView</a>
      </div>
    </footer>
  </div>

  <div id="globalToast" class="toast"></div>

  <script>
  (function() {
    /* Global health + data status polling */
    async function refreshGlobalHealth() {
      try {
        const r = await fetch("/api/health");
        if (!r.ok) return;
        const h = await r.json();

        /* Nav health dots */
        const dots = {
          healthRedis: h.redis,
          healthPostgres: h.postgres,
          healthCollector: h.collector_feed,
        };
        for (const [id, ok] of Object.entries(dots)) {
          const el = document.getElementById(id);
          if (!el) continue;
          el.className = "wored-health-dot " + (ok ? "is-ok" : "is-warn");
        }

        /* Data freshness status */
        const label = document.getElementById("dataStatusLabel");
        if (label) {
          if (h.redis && h.postgres && h.collector_feed) {
            label.textContent = "Данные доступны";
            label.className = "ui-text-success";
          } else if (h.postgres) {
            label.textContent = "Данные устарели";
            label.className = "ui-text-accent";
          } else {
            label.textContent = "Нет связи";
            label.className = "ui-text-danger";
          }
        }
      } catch (_) {
        const label = document.getElementById("dataStatusLabel");
        if (label) { label.textContent = "Нет связи"; label.className = "ui-text-danger"; }
      }
    }

    async function refreshAlertBadge() {
      try {
        const r = await fetch("/api/alerts?limit=1");
        if (!r.ok) return;
        const data = await r.json();
        const badge = document.getElementById("navAlertBadge");
        if (!badge) return;
        const openCount = data.counts?.open ?? 0;
        if (openCount > 0) {
          badge.className = "nav-badge";
          badge.textContent = openCount;
        } else {
          badge.className = "";
          badge.textContent = "";
        }
      } catch (_) {}
    }

    refreshGlobalHealth();
    refreshAlertBadge();
    setInterval(refreshGlobalHealth, 15000);
    setInterval(refreshAlertBadge, 30000);
  })();

  window.WORED_TOAST = function(message, level) {
    const toast = document.getElementById("globalToast");
    if (!toast) return;
    toast.textContent = message;
    toast.className = "toast is-visible" + (level === "ok" ? " toast-ok" : level === "bad" ? " toast-bad" : "");
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => { toast.className = "toast"; }, 3000);
  };
  </script>
  <script type="module" src="/static/ui/core.js"></script>
</body>
</html>
