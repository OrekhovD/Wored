{% extends "base.html" %}
{% block head_extra %}<script src="https://telegram.org/js/telegram-web-app.js?63"></script>{% endblock %}

{% block content %}
<main class="auth-layout">
  <section class="panel auth-panel">
    <div class="panel-kicker">Аутентификация</div>
    <h1>Вход в WORED</h1>
    <p class="auth-copy">
      Доступ для разрешённых администраторов.
    </p>
    <form method="post" action="/login" class="auth-form">
      <input type="hidden" name="next" value="{{ next_target }}">
      <label class="field">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <span>Имя пользователя</span>
        <input type="text" name="username" value="{{ admin_username }}" autocomplete="username" required>
      </label>
      <label class="field">
        <span>Пароль</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="primary-button">Войти</button>
    </form>
  </section>
</main>
<p id="telegram-auth-status" role="status" aria-live="polite"></p>
<script>
(function () {
  var telegram = window.Telegram && window.Telegram.WebApp;
  if (!telegram || !telegram.initData) return;
  var status = document.getElementById('telegram-auth-status');
  status.textContent = 'Проверяем доступ из Telegram\u2026';
  fetch('/api/auth/telegram', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    credentials: 'same-origin',
    body: JSON.stringify({init_data: telegram.initData, csrf_token: {{ csrf_token | tojson }}})
  }).then(function (response) {
    if (!response.ok) throw new Error('Вход из Telegram не подтверждён. Войдите с паролем.');
    return response.json();
  }).then(function () {
    window.location.replace({{ next_target | tojson }});
  }).catch(function (err) {
    status.textContent = err.message;
  });
})();
</script>
{% endblock %}
