[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# free_routing_archive is a frozen snapshot of the retired free-model routing
# subsystem (OmniRoute / NVIDIA NIM / tokenrouter / dashscope / minimax). It is
# not part of the WORED runtime and must not be collected; see
# free_routing_archive/README.md for the revival procedure.
norecursedirs = free_routing_archive
addopts = --ignore=free_routing_archive