name: stabilization

# The isolated acceptance gate: the same command the operator runs on the workstation,
# so CI and local results cannot diverge. postgres-qa is a disposable tmpfs instance,
# the network is internal, and the suite runs on mocks - no secrets are needed here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run stabilization suite in the QA image
        run: |
          docker compose -p wored-qa -f docker-compose.qa.yml run --rm --build checks
      - name: Remove QA containers
        if: always()
        run: |
          docker compose -p wored-qa -f docker-compose.qa.yml down --remove-orphans
