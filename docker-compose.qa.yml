# Isolated QA only: no production env files, host ports or persistent volumes.
services:
  postgres-qa:
    image: postgres:16
    environment:
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: disposable-qa-only
      POSTGRES_DB: wored_qa
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa -d wored_qa"]
      interval: 2s
      timeout: 2s
      retries: 20
  checks:
    build:
      context: .
      dockerfile: docker/qa.Dockerfile
    environment:
      WORED_TEST_DATABASE_URL: postgresql://qa:disposable-qa-only@postgres-qa:5432/wored_qa
    depends_on:
      postgres-qa:
        condition: service_healthy
networks:
  default:
    internal: true
